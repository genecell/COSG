[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "cosg"
dynamic = ["version"]     # single source: cosg/__init__.py
description = "Accurate and fast cell marker gene identification with COSG (with optional GPU acceleration)"
requires-python = ">=3.6"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Min Dai", email = "dai@broadinstitute.org" }
]
maintainers = [
    { name = "Min Dai", email = "dai@broadinstitute.org" }
]
# Point at the file, not an inline string. A `{text = ...}` literal here makes
# the PyPI project page show only that one sentence -- README.rst is never
# read. hatchling infers content-type text/x-rst from the extension.
readme = "README.rst"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "anndata>=0.8",
    "numpy>=1.17.0",
    "pandas>=0.21",
    "scikit-learn>=0.21.2",
    "scipy>=1.4",
    "matplotlib>=3.5.2",
    "networkx>=2.8.8",
    # Declared directly rather than left to scanpy, which used to supply it
    # transitively: cosg.py has a module-level `import numba` for the sparse
    # mean/variance kernels, and relying on a transitive dependency for that
    # is what broke a clean install.
    "numba>=0.51",
    "typing-extensions",
]

# Project URLs
[project.urls]
Documentation = "https://genecell.github.io/COSG"
Source = "https://github.com/genecell/COSG"
Homepage = "https://genecell.github.io/COSG"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.0.0",  # For CUDA 12.x; users on CUDA 11.x should: pip install cupy-cuda11x
]
# plotMarkerDotplot wraps scanpy's sc.pl.dotplot and is the only part of COSG
# that needs scanpy. 1.0.4 required scanpy for everyone; keeping it mandatory
# costs a plain install ~60 MB and 9 packages (statsmodels, seaborn,
# umap-learn, ...) for one plotting function. plotMarkerDendrogram and
# plotMarkerStream do not need it -- their dendrogram ordering is computed by
# cosg's own _dendrogram_order().
dotplot = [
    "scanpy>=1.6.0"
]
# Same rule as scanpy above, applied consistently: the cytome streaming
# backend is one optional path, so a plain `pip install cosg` should not carry
# it. cosg.cosg() on a .cytome path raises an ImportError naming this extra.
# Upper bound because cytome pins its public API with a conformance test, so
# 0.x minors are safe; the bound only stops a future 1.0 cleanup reaching
# installs pinned to this release.
cytome = [
    "cytome>=0.2.3,<1.0"
]
dev = [
    "pre-commit",
    "pytest",
    # Both optional features must be installed for the suite, or CI green means
    # very little: the dotplot and cytome-streaming tests would silently skip
    # (see tests/conftest.py) and a release could ship an untested backend.
    "scanpy>=1.6.0",
    "cytome>=0.2.3,<1.0",
]

[tool.hatch.version]
# One literal, in the package. A second one here drifts from it the moment
# a release is prepared -- which is how cytome 0.2.6 shipped a manifest
# claiming 0.2.5 and failed its own publish workflow.
path = "cosg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cosg"]
